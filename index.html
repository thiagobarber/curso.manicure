<!doctype html>
<html lang="pt-BR" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente Nail Designer</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
  html, body { height: 100%; width: 100%; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', sans-serif;
    background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #f9a8d4 100%);
    background-attachment: fixed;
  }
  .font-display { font-family: 'Fraunces', serif; }
  
  .chat-bubble-in {
    animation: bubbleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    opacity: 0;
    transform: translateY(10px) scale(0.95);
  }
  @keyframes bubbleIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  
  .option-btn {
    transition: all 0.25s ease;
  }
  .option-btn:hover {
    transform: translateX(4px);
  }
  
  .typing-dot {
    animation: typingBounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }
  
  .pulse-glow {
    animation: pulseGlow 2s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 10px 30px -5px rgba(236, 72, 153, 0.5); }
    50% { box-shadow: 0 15px 40px -5px rgba(236, 72, 153, 0.8); }
  }
  
  .avatar-ring {
    background: linear-gradient(135deg, #ec4899, #f472b6, #fb7185);
    animation: rotate 4s linear infinite;
  }
  @keyframes rotate {
    to { transform: rotate(360deg); }
  }
  
  .chat-scroll::-webkit-scrollbar { width: 6px; }
  .chat-scroll::-webkit-scrollbar-track { background: transparent; }
  .chat-scroll::-webkit-scrollbar-thumb { background: #f9a8d4; border-radius: 10px; }
  
  .heart-float {
    position: absolute;
    animation: floatUp 3s ease-in-out infinite;
    opacity: 0.3;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    20% { opacity: 0.4; }
    100% { transform: translateY(-100px) rotate(20deg); opacity: 0; }
  }
  
  .cta-shine {
    position: relative;
    overflow: hidden;
  }
  .cta-shine::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: shine 3s infinite;
  }
  @keyframes shine {
    100% { left: 100%; }
  }
</style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full w-full overflow-auto">
  <main class="w-full h-full flex items-center justify-center p-3 sm:p-6 relative">
   <!-- Floating decorative hearts -->
   <div class="heart-float" style="left: 10%; top: 80%; animation-delay: 0s;">
    💖
   </div>
   <div class="heart-float" style="left: 85%; top: 70%; animation-delay: 1s;">
    💅
   </div>
   <div class="heart-float" style="left: 20%; top: 30%; animation-delay: 2s;">
    ✨
   </div>
   <div class="w-full max-w-md mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col" style="max-height: 95%; height: 700px;">
    <!-- Header -->
    <header class="bg-gradient-to-br from-pink-500 via-pink-400 to-rose-400 p-5 text-white relative overflow-hidden flex-shrink-0">
     <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-16 -mt-16"></div>
     <div class="absolute bottom-0 left-0 w-24 h-24 bg-white/10 rounded-full -ml-12 -mb-12"></div>
     <div class="relative flex items-center gap-3">
      <div class="relative">
       <div class="avatar-ring w-14 h-14 rounded-full p-1">
        <div class="w-full h-full rounded-full bg-white flex items-center justify-center text-2xl">
         💅
        </div>
       </div>
       <div class="absolute bottom-0 right-0 w-4 h-4 bg-green-400 rounded-full border-2 border-white"></div>
      </div>
      <div class="flex-1">
       <h1 id="assistantName" class="font-display text-xl font-bold leading-tight">Bella</h1>
       <p class="text-xs text-pink-50 flex items-center gap-1"><span class="w-1.5 h-1.5 bg-green-300 rounded-full animate-pulse"></span> Online • Consultora de Nail Design</p>
      </div><button id="restartBtn" class="p-2 rounded-full hover:bg-white/20 transition" title="Reiniciar conversa" aria-label="Reiniciar conversa"> <i data-lucide="rotate-ccw" style="width: 18px; height: 18px;"></i> </button>
     </div>
    </header><!-- Chat Area -->
    <div id="chatArea" class="chat-scroll flex-1 overflow-y-auto p-4 space-y-4 bg-gradient-to-b from-pink-50/50 to-white">
     <!-- Messages injected here -->
    </div><!-- Options Area -->
    <div id="optionsArea" class="flex-shrink-0 p-4 bg-gradient-to-t from-white via-white to-transparent border-t border-pink-100 space-y-2">
     <!-- Options injected here -->
    </div>
   </div>
  </main>
  <script>
  const defaultConfig = {
    assistant_name: "Bella",
    welcome_title: "Oi, linda! 💕",
    welcome_message: "Sou a Bella, sua consultora de Nail Design! Vou te ajudar a descobrir como profissionais da área conseguem prosperar nesse mercado. Você tem 3 perguntinhas rápidas pra responder?",
    cta_button_text: "QUERO CONHECER O CURSO",
    cta_url: "https://kiwify.app/Id6QFcn?afid=822s7lg6"
  };

  let config = { ...defaultConfig };
  let currentStep = 0;
  let userAnswers = [];
  let isWaitingForResponse = false;

  const chatArea = document.getElementById('chatArea');
  const optionsArea = document.getElementById('optionsArea');

  // Conversation flow - Conversation structure moved outside to avoid reference issues
  let flow = [];
  
  function initializeFlow() {
    flow = [
      {
        // Step 0 - Welcome + first question
        messages: [
          () => `<strong>${config.welcome_title}</strong><br><br>${config.welcome_message}`
        ],
        options: [
          { text: "Sim, pode perguntar! 💖", next: 1 },
          { text: "Já quero ver o curso!", next: 'cta_direct' }
        ]
      },
      {
        // Step 1 - First question: experience level
        messages: [
          () => "Qual sua situação <strong>no Nail Design</strong>? 👇"
        ],
        options: [
          { text: "🌱 Sou total iniciante, nunca fiz unha", answer: "iniciante", next: 2 },
          { text: "🎨 Já faço unhas, mas de forma amadora", answer: "amadora", next: 2 },
          { text: "💼 Já sou profissional e quero evoluir", answer: "profissional", next: 2 }
        ]
      },
      {
        // Step 2 - Pain points by level + second question
        messages: [
          (answer) => {
            const responses = {
              iniciante: "Adorei sua coragem! 🌟 Muitas meninas começam ZERO e em 30 dias já estão faturando bem. Você aprende tudo do zero: desde como escolher o kit certo até técnicas de alongamento e nail art que fazem cliente ficar boca aberta! 💅✨",
              amadora: "Que legal você já trabalhar com unhas! 💖 Mas deixa eu ser sincera: tem uma ENORME diferença entre fazer unhas amadoramente e ser uma <strong>Nail Designer profissional</strong>. Profissionais cobram muito mais! Sabia que tem técnicas avançadas que você pode estar deixando dinheiro na mesa? 💎",
              profissional: "Que incrível! 👑 Você já conhece o mercado, mas deixa eu te falar: as profissionais que ganham bem não só sabem fazer unha - elas dominam <strong>gestão, marketing estratégico, técnicas exclusivas</strong> que poucas dominam. Vamos elevar ainda mais seu nível? 🚀"
            };
            return responses[answer] || responses.iniciante;
          },
          () => "Qual seu <strong>principal desafio</strong> AGORA? 👇"
        ],
        options: [
          { text: "💰 Ganhar mais renda rapidamente", answer: "renda", next: 3 },
          { text: "📈 Crescer e escalar meu negócio", answer: "crescer", next: 3 },
          { text: "🎓 Aprimorar minhas técnicas e conhecimento", answer: "tecnicas", next: 3 }
        ]
      },
      {
        // Step 3 - Personalized pitch + final call
        messages: [
          (answer) => {
            const responses = {
              renda: "Perfeito! 💚 O curso te ensina EXATAMENTE como aumentar sua ticket (preço por unhas), com técnicas que clientes AMAM e cobram premium. Plus: estratégias de agenda lotada que geram renda consistente. 💸",
              crescer: "Isso é pensamento de empreendedora! 🎯 Vou te ensinar como profissionalizar sua operação: desde gestão de clientes, até expandir para novos serviços (alongamento, nail art sofisticada, lash design). 📊",
              tecnicas: "Menina, você no caminho certo! 🌟 O curso tem módulos EXCLUSIVOS de técnicas avançadas que ninguém ensina por aí: encapsulado perfeito, alongamentos naturais com efeito glass, nail art 3D, designs que viralizam. Quando você domina essas técnicas, <strong>clientes pagam mais!</strong> 💎✨"
            };
            return responses[answer] || responses.renda;
          },
          () => `Linda, chegou o momento... 💖<br><br>Você merece estar no topo da profissão. O Nail Design é <strong>a porta de entrada pro sucesso</strong> - mas só se feito com técnica, estratégia e conhecimento!<br><br>🔥 <strong>OFERTA EXCLUSIVA:</strong><br>✅ Curso 360° pra iniciantes e profissionais<br>✅ Técnicas avançadas + nail art sofisticada<br>✅ Módulo de gestão e marketing estratégico<br>✅ Comunidade VIP com suporte 24/7<br>✅ Garantia de 7 dias ou devolvo seu dinheiro<br><br><strong>Acesso completo em poucas parcelas</strong> 💳`
        ],
        options: [
          { text: "🚀 Quero começar AGORA e mudar de vida!", next: 'cta' }
        ]
      }
    ];
  }

  function renderAssistantMessage(html) {
    return `
      <div class="flex items-start gap-2 chat-bubble-in">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-pink-400 to-rose-400 flex items-center justify-center text-sm flex-shrink-0 shadow-md">
          💅
        </div>
        <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-pink-100 max-w-[85%]">
          <p class="text-sm text-gray-700 leading-relaxed">${html}</p>
        </div>
      </div>
    `;
  }

  function renderUserMessage(text) {
    return `
      <div class="flex items-start gap-2 justify-end chat-bubble-in">
        <div class="bg-gradient-to-br from-pink-500 to-rose-500 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 shadow-md max-w-[85%]">
          <p class="text-sm leading-relaxed">${text}</p>
        </div>
      </div>
    `;
  }

  function renderTyping() {
    return `
      <div id="typingIndicator" class="flex items-start gap-2 chat-bubble-in">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-pink-400 to-rose-400 flex items-center justify-center text-sm flex-shrink-0 shadow-md">
          💅
        </div>
        <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-pink-100">
          <div class="flex gap-1">
            <span class="typing-dot w-2 h-2 bg-pink-400 rounded-full"></span>
            <span class="typing-dot w-2 h-2 bg-pink-400 rounded-full"></span>
            <span class="typing-dot w-2 h-2 bg-pink-400 rounded-full"></span>
          </div>
        </div>
      </div>
    `;
  }

  function scrollToBottom() {
    setTimeout(() => {
      if (chatArea) {
        chatArea.scrollTop = chatArea.scrollHeight;
      }
    }, 50);
  }

  function showTyping() {
    chatArea.insertAdjacentHTML('beforeend', renderTyping());
    scrollToBottom();
  }

  function hideTyping() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
  }

  function clearOptions() {
    optionsArea.innerHTML = '';
  }

  async function showStep(stepIndex, lastAnswer) {
    if (isWaitingForResponse) return;
    
    isWaitingForResponse = true;
    const step = flow[stepIndex];
    
    if (!step) {
      console.error('Step not found:', stepIndex);
      isWaitingForResponse = false;
      return;
    }
    
    clearOptions();

    // Show each message with typing delay
    for (let i = 0; i < step.messages.length; i++) {
      showTyping();
      await new Promise(r => setTimeout(r, 1200));
      hideTyping();
      
      try {
        const msg = typeof step.messages[i] === 'function' ? step.messages[i](lastAnswer) : step.messages[i];
        chatArea.insertAdjacentHTML('beforeend', renderAssistantMessage(msg));
        scrollToBottom();
        await new Promise(r => setTimeout(r, 400));
      } catch (e) {
        console.error('Error rendering message:', e);
      }
    }

    // Render options
    renderOptions(step.options);
    isWaitingForResponse = false;
  }

  function renderOptions(options) {
    optionsArea.innerHTML = '';
    options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn w-full text-left px-4 py-3 bg-gradient-to-r from-pink-50 to-rose-50 hover:from-pink-100 hover:to-rose-100 border-2 border-pink-200 hover:border-pink-400 rounded-2xl text-sm font-medium text-gray-700 transition-all';
      btn.style.animationDelay = `${idx * 0.08}s`;
      btn.style.animation = 'bubbleIn 0.4s ease forwards';
      btn.style.opacity = '0';
      btn.textContent = opt.text;
      btn.addEventListener('click', () => handleOptionClick(opt));
      optionsArea.appendChild(btn);
    });
  }

  function renderCTA() {
    optionsArea.innerHTML = `
      <a href="${config.cta_url}" target="_blank" rel="noopener noreferrer" class="cta-shine pulse-glow block w-full text-center px-4 py-4 bg-gradient-to-r from-pink-500 via-rose-500 to-pink-500 hover:from-pink-600 hover:to-rose-600 text-white rounded-2xl font-bold text-sm shadow-lg transition-all transform hover:scale-[1.02]">
        ${config.cta_button_text} →
      </a>
      <p class="text-center text-xs text-gray-500 mt-2">🔒 Compra 100% segura • Garantia de 7 dias</p>
    `;
  }

  async function handleOptionClick(option) {
    if (isWaitingForResponse) return;
    
    // Add user message
    chatArea.insertAdjacentHTML('beforeend', renderUserMessage(option.text));
    scrollToBottom();
    clearOptions();
    await new Promise(r => setTimeout(r, 400));

    if (option.next === 'cta' || option.next === 'cta_direct') {
      if (option.next === 'cta_direct') {
        showTyping();
        await new Promise(r => setTimeout(r, 1000));
        hideTyping();
        chatArea.insertAdjacentHTML('beforeend', renderAssistantMessage(
          "Adorei sua atitude! 🚀 Mulher decidida é mulher que prospera! Clica no botão abaixo pra garantir sua vaga com desconto especial 👇"
        ));
        scrollToBottom();
        await new Promise(r => setTimeout(r, 500));
      }
      renderCTA();
      return;
    }

    currentStep = option.next;
    await showStep(currentStep, option.answer);
  }

  function startConversation() {
    chatArea.innerHTML = '';
    optionsArea.innerHTML = '';
    currentStep = 0;
    userAnswers = [];
    isWaitingForResponse = false;
    showStep(0);
  }

  // Initialize on DOM ready
  function initializeApp() {
    const restartBtn = document.getElementById('restartBtn');
    if (restartBtn) {
      restartBtn.addEventListener('click', startConversation);
    }
    
    initializeFlow();
    
    // Element SDK Integration
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (newConfig) => {
          config = { ...defaultConfig, ...newConfig };
          const nameEl = document.getElementById('assistantName');
          if (nameEl) {
            nameEl.textContent = config.assistant_name || defaultConfig.assistant_name;
          }
          initializeFlow();
        },
        mapToCapabilities: () => ({
          recolorables: [],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (c) => new Map([
          ["assistant_name", c.assistant_name || defaultConfig.assistant_name],
          ["welcome_title", c.welcome_title || defaultConfig.welcome_title],
          ["welcome_message", c.welcome_message || defaultConfig.welcome_message],
          ["cta_button_text", c.cta_button_text || defaultConfig.cta_button_text],
          ["cta_url", c.cta_url || defaultConfig.cta_url]
        ])
      });
    }

    lucide.createIcons();
    startConversation();
  }

  // Start when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeApp);
  } else {
    initializeApp();
  }
</script>
